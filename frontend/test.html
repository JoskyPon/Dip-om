<!DOCTYPE html>
<html>

<head>
    <title>Простая форма</title>
    <link rel="stylesheet" href="test.css">
    <script src="test.js"></script>
</head>

<body>
    <h2>Добавить пользователя</h2>

    <div>
        <input type="text" id="dota" placeholder="Введите dota">
        <input type="text" id="cs" placeholder="Введите cs">
        <button class="btn">Добавить</button>
    </div>

    <div id="result">Здесь будет результат...</div>

    <h3>Список инфы:</h3>
    <div id="userList">Загрузка...</div>
    <script>
// Функция для тестирования подключения
async function testConnection() {
  console.log('🔍 Тестируем подключение к серверу...');
  
  try {
    const response = await fetch('http://localhost:3001/api/users');
    const text = await response.text();
    
    console.log('Статус:', response.status);
    console.log('Content-Type:', response.headers.get('content-type'));
    console.log('Ответ:', text.substring(0, 200));
    
    if (text.includes('<html>')) {
      console.error('⚠️ ВНИМАНИЕ: Сервер возвращает HTML вместо JSON!');
      console.error('Вероятные причины:');
      console.error('1. Сервер не запущен');
      console.error('2. Неправильный URL');
      console.error('3. Express маршруты не настроены');
    }
    
  } catch (error) {
    console.error('❌ Ошибка подключения:', error.message);
  }
}

// Вызовите при загрузке страницы
document.addEventListener('DOMContentLoaded', testConnection);
</script>
</body>

</html>
